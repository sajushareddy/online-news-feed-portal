<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta News</title>
    <style>
        /* Dark Mode Theme */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-text: #e0e0e0;
            --secondary-text: #a0a0a0;
            --accent-color: #03dac6;
            --accent-hover: #01b8a5;
            --border-color: #2c2c2c;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --info-bg: rgba(61, 139, 253, 0.1);
            --warning-bg: rgba(253, 186, 61, 0.1);
            --warning-border: #fdba3d;
            --positive-bg: rgba(3, 218, 198, 0.1);
            --positive-border: #03dac6;
            --negative-bg: rgba(207, 102, 121, 0.1);
            --negative-border: #cf6679;
            --neutral-bg: rgba(160, 160, 160, 0.1);
            --neutral-border: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--primary-text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-color), #618bfd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        header p {
            color: var(--secondary-text);
            font-size: 1.1rem;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 1.5rem;
            position: relative;
        }

        /* Styles for custom selectors (Country) */
        .custom-selector {
            position: relative;
            width: 150px;
        }
        .selector-selected {
            background-color: var(--surface-color);
            color: var(--primary-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selector-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 5px;
            z-index: 10;
            overflow: hidden;
        }
        .selector-options div {
            padding: 10px 15px;
            cursor: pointer;
        }
        .selector-options div:hover {
            background-color: var(--border-color);
        }

        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--primary-text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        nav {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav button {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--surface-color);
            color: var(--secondary-text);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        nav button:hover {
            background-color: var(--border-color);
            color: var(--primary-text);
        }

        nav button.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }
        
        .loader-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .skeleton-card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 1rem;
            height: 450px;
            overflow: hidden;
            position: relative;
        }

        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.05) 20%, rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0));
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .skeleton-img { width: 100%; height: 200px; background: var(--border-color); border-radius: 8px; margin-bottom: 1rem; }
        .skeleton-line { height: 20px; background: var(--border-color); border-radius: 4px; margin-bottom: 10px; }
        .skeleton-line.short { width: 60%; }

        #news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px var(--shadow-color); }
        .news-card img { width: 100%; height: 200px; object-fit: cover; margin-bottom: 1rem; border-radius: 8px; }
        .news-card h2 { font-size: 1.2rem; margin: 0 0 0.5rem 0; line-height: 1.4; color: var(--primary-text); }
        .news-card p.description { font-size: 0.95rem; flex-grow: 1; color: var(--secondary-text); line-height: 1.6; }
        .news-card a { display: inline-block; margin-bottom: 1rem; color: var(--accent-color); text-decoration: none; font-weight: 600; }
        .news-card a:hover { text-decoration: underline; }
        
        .source-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .action-buttons button {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--secondary-text);
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .action-buttons button:hover {
             background: var(--accent-hover);
             color: var(--bg-color);
             border-color: var(--accent-hover);
        }
        .read-aloud-btn {
            padding: 10px;
            min-width: 44px; /* for accessibility */
        }
        .read-aloud-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--secondary-text);
            transition: fill 0.2s;
        }
        .read-aloud-btn:hover svg {
            fill: var(--bg-color);
        }


        .summary-box, .sentiment-box, .error-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            animation: fadeIn 0.5s ease-in-out;
            background: var(--info-bg);
            border-left: 4px solid var(--accent-color);
        }
        .error-box {
            background: var(--warning-bg);
            border-left-color: var(--warning-border);
        }
        .sentiment-box.Positive { background: var(--positive-bg); border-left-color: var(--positive-border); }
        .sentiment-box.Negative { background: var(--negative-bg); border-left-color: var(--negative-border); }
        .sentiment-box.Neutral { background: var(--neutral-bg); border-left-color: var(--neutral-border); }
        .summary-box p, .sentiment-box p, .error-box p { margin:0; color:var(--primary-text); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Insta News 🛡️</h1>
            <p>AI-Powered News Summaries</p>
            <div class="header-controls">
                <!-- Country Selector -->
                <div class="custom-selector">
                    <div class="selector-selected" id="country-selected">
                        <span id="selected-country-text">USA</span>
                        <span>▼</span>
                    </div>
                    <div class="selector-options" id="country-options">
                        <div data-value="us">USA</div>
                        <div data-value="in">India</div>
                        <div data-value="gb">UK</div>
                        <div data-value="ca">Canada</div>
                        <div data-value="au">Australia</div>
                    </div>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for news by keyword...">
            </div>
            <nav id="category-nav"></nav>
        </header>
        <main>
            <div id="news-grid"></div>
        </main>
    </div>

<script>
    const BACKEND_URL = 'http://localhost:5001';
    const newsGrid = document.getElementById('news-grid');
    const categoryNav = document.getElementById('category-nav');
    const searchInput = document.getElementById('search-input');
    
    // Country selector elements
    const countrySelector = document.getElementById('country-selected');
    const countryOptions = document.getElementById('country-options');
    const selectedCountryText = document.getElementById('selected-country-text');

    const categories = ['general', 'business', 'technology', 'entertainment', 'sports', 'science'];
    let currentCategory = 'general';
    let currentCountry = 'us';

    function renderLoader() {
        let loaderHTML = '<div class="loader-container">';
        for (let i = 0; i < 6; i++) {
            loaderHTML += `<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div></div>`;
        }
        newsGrid.innerHTML = loaderHTML + '</div>';
    }

    async function fetchNews(type, value) {
        // Stop any speech before fetching new articles
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
        }
        renderLoader();
        let url = '';
        if (type === 'category') {
            document.querySelectorAll('#category-nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.category === value));
            url = `${BACKEND_URL}/api/news?category=${value}&country=${currentCountry}`;
        } else if (type === 'search') {
            document.querySelectorAll('#category-nav button').forEach(btn => btn.classList.remove('active'));
            url = `${BACKEND_URL}/api/search?q=${value}`;
        }
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            const validArticles = data.articles.filter(a => a.title && (a.content || a.description) && a.urlToImage);
            renderArticles(validArticles);
        } catch (error) {
            console.error("Error fetching news:", error);
            newsGrid.innerHTML = '<p style="text-align:center;">Failed to load news. Is the backend server running?</p>';
        }
    }
    
    function showCardError(card, message) {
        const existingError = card.querySelector('.error-box');
        if (existingError) existingError.remove();
        const errorBox = document.createElement('div');
        errorBox.className = 'error-box';
        errorBox.innerHTML = `<p><strong>Error:</strong> ${message}</p>`;
        card.appendChild(errorBox);
        setTimeout(() => errorBox.remove(), 5000);
    }

    async function handleSummarize(article, buttonElement) {
        const card = buttonElement.closest('.news-card');
        const existingResult = card.querySelector('.summary-box');
        if (existingResult) { existingResult.remove(); return; }
        buttonElement.textContent = 'Summarizing...';
        buttonElement.disabled = true;
        try {
            const response = await fetch(`${BACKEND_URL}/api/summarize`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ articleText: article.content || article.description || article.title })
            });
            if (response.status === 429) { showCardError(card, 'Rate limit reached. Please wait a moment.'); return; }
            if (!response.ok) throw new Error('Server error');
            const data = await response.json();
            const resultDiv = document.createElement('div');
            resultDiv.className = 'summary-box';
            if (data.success && data.summary) {
                resultDiv.innerHTML = `<p><strong>AI Summary:</strong></p><p>${data.summary}</p>`;
            } else {
                resultDiv.innerHTML = `<p>AI summary could not be generated.</p>`;
            }
            card.appendChild(resultDiv);
        } catch (error) {
            console.error('Summarization failed:', error);
            showCardError(card, 'Failed to retrieve AI summary.');
        } finally {
            buttonElement.textContent = 'Summarize';
            buttonElement.disabled = false;
        }
    }

    async function handleSentiment(article, buttonElement) {
        const card = buttonElement.closest('.news-card');
        const existingResult = card.querySelector('.sentiment-box');
        if (existingResult) { existingResult.remove(); return; }
        buttonElement.textContent = 'Analyzing...';
        buttonElement.disabled = true;
        try {
            const response = await fetch(`${BACKEND_URL}/api/sentiment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ articleText: article.content || article.description || article.title })
            });
            if (response.status === 429) { showCardError(card, 'Rate limit reached. Please wait a moment.'); return; }
            if (!response.ok) throw new Error('Server error');
            const data = await response.json();
            const resultDiv = document.createElement('div');
            resultDiv.className = 'sentiment-box';
            if (data.success && data.sentiment) {
                resultDiv.classList.add(data.sentiment); // Add class for color-coding
                resultDiv.innerHTML = `<p><strong>AI Sentiment:</strong> ${data.sentiment}</p>`;
            } else {
                resultDiv.innerHTML = `<p>Sentiment could not be analyzed.</p>`;
            }
            card.appendChild(resultDiv);
        } catch (error) {
            console.error('Sentiment analysis failed:', error);
            showCardError(card, 'Failed to analyze sentiment.');
        } finally {
            buttonElement.textContent = 'Sentiment';
            buttonElement.disabled = false;
        }
    }

    // --- NEW: Handle Read Aloud ---
    function handleReadAloud(article, buttonElement) {
        const speakerIcon = buttonElement.querySelector('.speaker-icon');
        const stopIcon = buttonElement.querySelector('.stop-icon');

        // If speech is currently happening, cancel it.
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
            return;
        }
        
        const textToRead = `${article.title}. ${article.description || ''}`;
        const utterance = new SpeechSynthesisUtterance(textToRead);

        // Update UI when speech starts
        utterance.onstart = () => {
            document.querySelectorAll('.stop-icon').forEach(icon => icon.style.display = 'none');
            document.querySelectorAll('.speaker-icon').forEach(icon => icon.style.display = 'block');
            speakerIcon.style.display = 'none';
            stopIcon.style.display = 'block';
        };

        // Update UI when speech ends (either naturally or by cancellation)
        utterance.onend = () => {
            speakerIcon.style.display = 'block';
            stopIcon.style.display = 'none';
        };

        speechSynthesis.speak(utterance);
    }


    function renderArticles(articles) {
        newsGrid.innerHTML = '';
        if (articles.length === 0) {
            newsGrid.innerHTML = '<p style="text-align:center;">No articles found for your query.</p>';
            return;
        }
        articles.forEach(article => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <img src="${article.urlToImage}" alt="${article.title}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/1e1e1e/e0e0e0?text=Image+Not+Found';">
                <p class="source-name">${article.source.name}</p>
                <h2>${article.title}</h2>
                <p class="description">${article.description || ''}</p>
                <a href="${article.url}" target="_blank" rel="noopener noreferrer">Read Full Article</a>
                <div class="action-buttons">
                    <button class="summarize-btn">Summarize</button>
                    <button class="sentiment-btn">Sentiment</button>
                    <button class="read-aloud-btn" title="Read Aloud">
                        <svg class="speaker-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg class="stop-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    </button>
                </div>
            `;
            const summarizeButton = card.querySelector('.summarize-btn');
            summarizeButton.addEventListener('click', () => handleSummarize(article, summarizeButton));

            const sentimentButton = card.querySelector('.sentiment-btn');
            sentimentButton.addEventListener('click', () => handleSentiment(article, sentimentButton));
            
            const readAloudButton = card.querySelector('.read-aloud-btn');
            readAloudButton.addEventListener('click', () => handleReadAloud(article, readAloudButton));

            newsGrid.appendChild(card);
        });
    }
    
    function initialize() {
        categories.forEach(cat => {
            const btn = document.createElement('button');
            const text = cat.charAt(0).toUpperCase() + cat.slice(1);
            btn.textContent = text;
            btn.dataset.category = cat;
            if (cat === currentCategory) btn.classList.add('active');
            btn.addEventListener('click', () => {
                currentCategory = cat;
                searchInput.value = '';
                fetchNews('category', currentCategory);
            });
            categoryNav.appendChild(btn);
        });

        // Setup for custom country selector
        countrySelector.addEventListener('click', () => {
            countryOptions.style.display = countryOptions.style.display === 'block' ? 'none' : 'block';
        });
        countryOptions.addEventListener('click', (e) => {
            if (e.target.dataset.value) {
                currentCountry = e.target.dataset.value;
                selectedCountryText.textContent = e.target.textContent;
                countryOptions.style.display = 'none';
                fetchNews('category', currentCategory);
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!countrySelector.contains(e.target)) {
                countryOptions.style.display = 'none';
            }
        });

        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = searchInput.value.trim();
                if (query.length > 2) {
                    fetchNews('search', query);
                } else if (query.length === 0) {
                    fetchNews('category', currentCategory);
                }
            }, 500);
        });

        fetchNews('category', currentCategory);
    }

    document.addEventListener('DOMContentLoaded', initialize);
</script>
</body>
</html>
